name: MonayPay
version: 1.0.1
main: com.monaysmp.monaypay.MonayPay
api-version: '26.2'
folia-supported: false
depend: [Vault]
softdepend: [ExcellentEconomy]
author: MonaySMP
description: Native Minecraft dialog payments using Vault economy.
commands:
  pay:
    description: Open the MonaySMP native payment dialog or pay a player directly.
    usage: /pay [player] [amount]
    permission: monaypay.use
permissions:
  monaypay.use:
    description: Allows use of /pay.
    default: true
